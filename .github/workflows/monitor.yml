name: Monitor JP BH Posta

on:
  workflow_dispatch:

  # Re-enable daily monitoring after the diagnostic run works.
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run monitor in diagnostic mode
        env:
          CALCULATOR_URL: ${{ secrets.CALCULATOR_URL }}
        run: |
          python monitor.py

      - name: Show generated files
        if: always()
        run: |
          echo "===== Repository files ====="
          find . -maxdepth 2 -type f | sort

          echo
          echo "===== countries.txt ====="
          if [ -f countries.txt ]; then
            cat countries.txt
          else
            echo "countries.txt does not exist"
          fi

          echo
          echo "===== Diagnostic files ====="
          for f in diagnostic.txt diagnostic.html response.html page.html debug.txt; do
            if [ -f "$f" ]; then
              echo
              echo "----- $f -----"
              head -c 30000 "$f"
              echo
            fi
          done

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jp-bh-posta-diagnostic
          path: |
            countries.txt
            diagnostic.txt
            diagnostic.html
            response.html
            page.html
            debug.txt
          if-no-files-found: ignore
          retention-days: 7

