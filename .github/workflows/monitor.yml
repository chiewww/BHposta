name: Monitor BH Posta Countries

on:
  schedule:
    # Run once every day at 03:00 UTC.
    - cron: "0 3 * * *"

  # Allows manual testing from GitHub Actions.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    # Allow enough time for all 262+ destinations.
    timeout-minutes: 30

    steps:
      # ------------------------------------------------------
      # Check out repository
      # ------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Set up Python
      # ------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ------------------------------------------------------
      # Install Python dependencies
      # ------------------------------------------------------
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright requests beautifulsoup4

      # ------------------------------------------------------
      # Install Chromium and Linux dependencies
      # ------------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # ------------------------------------------------------
      # Run BH Posta monitor
      # ------------------------------------------------------
      - name: Monitor BH Posta countries
        run: |
          python monitor.py

      # ------------------------------------------------------
      # Show generated combined result file
      # ------------------------------------------------------
      - name: Show monitor results
        if: always()
        run: |
          echo "========================================"
          echo "BH POSTA COUNTRY RESULTS"
          echo "========================================"

          if [ -f bh_posta_countries.txt ]; then
            cat bh_posta_countries.txt
          else
            echo "bh_posta_countries.txt not found"
          fi

      # ------------------------------------------------------
      # Check whether combined output file changed
      # ------------------------------------------------------
      - name: Check for changes
        id: changes
        if: always()
        run: |
          echo "========================================"
          echo "CHECKING FOR OUTPUT FILE CHANGES"
          echo "========================================"

          git status --short

          changed=false

          if [ -f bh_posta_countries.txt ]; then
            echo
            echo "Found: bh_posta_countries.txt"

            # Detect modifications to tracked file.
            if ! git diff --quiet -- bh_posta_countries.txt; then
              echo "  -> modified"
              changed=true
            fi

            # Detect newly created untracked file.
            if git ls-files --error-unmatch bh_posta_countries.txt >/dev/null 2>&1; then
              echo "  -> tracked"
            else
              echo "  -> untracked"
              changed=true
            fi
          else
            echo
            echo "Missing: bh_posta_countries.txt"
          fi

          echo
          echo "========================================"

          if [ "$changed" = "true" ]; then
            echo "Changes detected."
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo
            echo "========================================"
            echo "GIT STATUS"
            echo "========================================"

            git status --short

            echo
            echo "========================================"
            echo "GIT DIFF"
            echo "========================================"

            git diff -- bh_posta_countries.txt || true
          else
            echo "No changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # ------------------------------------------------------
      # Commit changed combined country list
      # ------------------------------------------------------
      - name: Commit changed country list
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bh_posta_countries.txt

          echo "========================================"
          echo "FILE TO COMMIT"
          echo "========================================"

          git status --short

          git commit -m "Update international postcard country list"

          git push
