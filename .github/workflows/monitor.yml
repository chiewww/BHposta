name: Monitor JP BH Posta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        continue-on-error: true
        run: |
          python -m playwright install --with-deps chromium

      - name: Check monitor.py syntax
        id: syntax
        continue-on-error: true
        run: |
          echo "Checking monitor.py syntax..."
          python -m py_compile monitor.py
          echo "Syntax OK."

      - name: Run monitor
        id: monitor
        continue-on-error: true
        env:
          CALCULATOR_URL: https://www.posta.ba/kalkulator-cijena/
        run: |
          echo "Starting monitor..."
          python monitor.py

      - name: Collect monitor files
        if: always()
        run: |
          echo "============================================================"
          echo "MONITOR FILE COLLECTION"
          echo "============================================================"

          echo
          echo "Current directory:"
          pwd

          echo
          echo "Repository files:"
          find . -maxdepth 3 -type f -print | sort

          echo
          echo "============================================================"
          echo "calculator-results.txt"
          echo "============================================================"

          if [ -f calculator-results.txt ]; then
            echo "FOUND calculator-results.txt"
            wc -c calculator-results.txt
            cat calculator-results.txt
          else
            echo "NOT FOUND"
          fi

          echo
          echo "============================================================"
          echo "countries.txt"
          echo "============================================================"

          if [ -f countries.txt ]; then
            echo "FOUND countries.txt"
            wc -c countries.txt
            cat countries.txt
          else
            echo "NOT FOUND"
          fi

          echo
          echo "============================================================"
          echo "diagnostic.txt"
          echo "============================================================"

          if [ -f diagnostic.txt ]; then
            wc -c diagnostic.txt
            cat diagnostic.txt
          else
            echo "NOT FOUND"
          fi

          echo
          echo "============================================================"
          echo "iframe.txt"
          echo "============================================================"

          if [ -f iframe.txt ]; then
            wc -c iframe.txt
            cat iframe.txt
          else
            echo "NOT FOUND"
          fi

          echo
          echo "============================================================"
          echo "FILE LIST"
          echo "============================================================"

          ls -lah

      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jp-bh-posta-monitor
          path: |
            calculator-results.txt
            countries.txt
            diagnostic.txt
            diagnostic.html
            diagnostic.png
            page.html
            iframe.html
            iframe.txt
            monitor.py
            monitor.yml
          if-no-files-found: warn
          retention-days: 14

      - name: Final status
        if: always()
        run: |
          echo "============================================================"
          echo "FINAL STATUS"
          echo "============================================================"
          echo "Syntax check: ${{ steps.syntax.outcome }}"
          echo "Monitor:      ${{ steps.monitor.outcome }}"
          echo "============================================================"

          if [ "${{ steps.syntax.outcome }}" != "success" ]; then
            echo "monitor.py has a syntax error."
            exit 1
          fi

          if [ "${{ steps.monitor.outcome }}" != "success" ]; then
            echo "Monitor execution failed."
            exit 1
          fi

          echo "Monitor completed successfully."
