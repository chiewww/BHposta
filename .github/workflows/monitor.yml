name: BH Pošta Dopisnica Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BH Pošta monitor
        id: monitor
        continue-on-error: true
        run: |
          python monitor.py

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhposta-debug
          path: debug/
          if-no-files-found: warn

      - name: Show output
        if: always()
        run: |
          if [ -f output/bhposta_dopisnica.txt ]; then
            echo "======================================"
            echo "BH Pošta output"
            echo "======================================"
            cat output/bhposta_dopisnica.txt
          else
            echo "No output file was created."
          fi

      - name: Commit updated result
        if: steps.monitor.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/bhposta_dopisnica.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update BH Pošta Dopisnica data"
            git push
          fi

      - name: Fail workflow if monitor failed
        if: steps.monitor.outcome == 'failure'
        run: |
          echo "BH Pošta monitor failed."
          exit 1
