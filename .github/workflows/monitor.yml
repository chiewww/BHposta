name: Monitor JP BH Posta

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    name: Run BH Pošta calculator monitor
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # PLAYWRIGHT
      # ============================================================

      - name: Install Playwright
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install playwright

          python -m playwright install --with-deps chromium

      # ============================================================
      # VERIFY MONITOR
      # ============================================================

      - name: Verify monitor.py
        run: |
          set -e

          echo "============================================================"
          echo "VERIFYING monitor.py"
          echo "============================================================"

          if [ ! -f monitor.py ]; then
            echo "ERROR: monitor.py was not found."
            exit 1
          fi

          ls -lh monitor.py
          wc -l monitor.py

          echo
          echo "Checking Python syntax..."

          python -m py_compile monitor.py

          echo
          echo "Syntax OK."

      # ============================================================
      # RUN MONITOR
      # ============================================================

      - name: Run monitor
        env:
          CALCULATOR_URL: https://www.posta.ba/kalkulator-cijena/
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          echo "============================================================"
          echo "JP BH POŠTA CALCULATOR MONITOR"
          echo "============================================================"

          echo
          python --version

          echo
          echo "Starting monitor.py..."

          python monitor.py

          echo
          echo "============================================================"
          echo "MONITOR FINISHED"
          echo "============================================================"

      # ============================================================
      # SHOW RESULT
      # ============================================================

      - name: Show posta-countries.txt
        if: always()
        run: |
          echo "============================================================"
          echo "POSTA-COUNTRIES.TXT"
          echo "============================================================"

          if [ -f posta-countries.txt ]; then
            echo
            echo "File exists:"
            ls -lh posta-countries.txt

            echo
            echo "Contents:"
            cat posta-countries.txt
          else
            echo
            echo "ERROR: posta-countries.txt was not created."
          fi

      # ============================================================
      # COMMIT CHANGES
      # ============================================================

      - name: Commit updated country list
        if: success()
        run: |
          set -e

          echo "============================================================"
          echo "CHECKING FOR CHANGES"
          echo "============================================================"

          if [ ! -f posta-countries.txt ]; then
            echo "ERROR: posta-countries.txt does not exist."
            exit 1
          fi

          git status --short

          if git diff --quiet -- posta-countries.txt; then
            echo
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          echo
          echo "Changes detected in posta-countries.txt."

          echo
          echo "Diff:"
          git diff -- posta-countries.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posta-countries.txt

          git commit \
            -m "Update JP BH Posta country monitor"

          git push

          echo
          echo "============================================================"
          echo "CHANGES COMMITTED AND PUSHED"
          echo "============================================================"

      # ============================================================
      # UPLOAD RESULT AS ARTIFACT
      #
      # This is useful for troubleshooting even if something goes
      # wrong before the Git commit.
      # ============================================================

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posta-countries-${{ github.run_number }}
          path: posta-countries.txt
          if-no-files-found: warn
          retention-days: 14
