name: Monitor JP BH Posta

on:
  schedule:
    # Every day at 03:00 UTC
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    name: Run BH Pošta calculator monitor
    runs-on: ubuntu-latest

    timeout-minutes: 60

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # PYTHON
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ============================================================
      # PLAYWRIGHT
      # ============================================================

      - name: Install Playwright
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install playwright

          python -m playwright install --with-deps chromium

      # ============================================================
      # RUN MONITOR
      # ============================================================

      - name: Run monitor
        env:
          CALCULATOR_URL: https://www.posta.ba/kalkulator-cijena/
          PYTHONUNBUFFERED: "1"
        run: |
          set -e

          echo "============================================================"
          echo "JP BH POŠTA CALCULATOR MONITOR"
          echo "============================================================"

          python --version

          echo
          echo "Running monitor.py..."

          python monitor.py

          echo
          echo "============================================================"
          echo "MONITOR FINISHED"
          echo "============================================================"

          if [ ! -f posta-countries.txt ]; then
            echo "ERROR: posta-countries.txt was not created."
            exit 1
          fi

          echo
          echo "Output file:"
          ls -lh posta-countries.txt

          echo
          echo "Output:"
          cat posta-countries.txt

      # ============================================================
      # COMMIT CHANGES
      # ============================================================

      - name: Commit updated country list
        run: |
          set -e

          echo "============================================================"
          echo "CHECKING FOR CHANGES"
          echo "============================================================"

          git status --short

          if git diff --quiet -- posta-countries.txt; then
            echo
            echo "No changes detected."
            echo "Nothing to commit."
            exit 0
          fi

          echo
          echo "Changes detected in posta-countries.txt."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add posta-countries.txt

          git commit \
            -m "Update JP BH Posta country monitor"

          git push

          echo
          echo "============================================================"
          echo "CHANGES COMMITTED AND PUSHED"
          echo "============================================================"
