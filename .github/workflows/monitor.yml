name: BH Pošta Dopisnica Monitor

on:
  workflow_dispatch:

  schedule:
    # Every day at 02:00 UTC.
    # This is 04:00 in Bosnia during summer time.
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run BH Pošta monitor
        run: |
          python monitor.py

      - name: Show output
        run: |
          echo "======================================"
          echo "BH Pošta output"
          echo "======================================"
          cat output/bhposta_dopisnica.txt

      - name: Commit updated result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/bhposta_dopisnica.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update BH Pošta Dopisnica data"
            git push
          fi
