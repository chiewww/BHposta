name: BH Pošta Dopisnica Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run diagnostic
        run: |
          python monitor.py

      - name: Show diagnostic files
        if: always()
        run: |
          echo "======================================"
          echo "Repository files"
          echo "======================================"

          find . -maxdepth 3 -type f | sort

          echo ""
          echo "======================================"
          echo "Debug directory"
          echo "======================================"

          if [ -d debug ]; then
            ls -lah debug
          else
            echo "No debug directory."
          fi

      - name: Upload diagnostic response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bhposta-diagnostic
          path: debug/
          if-no-files-found: warn
