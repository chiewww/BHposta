name: Monitor JP BH Posta

on:
  schedule:
    # GitHub Actions uses UTC.
    # This example runs at 03:00 UTC every day.
    - cron: "0 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run monitor
        env:
          CALCULATOR_URL: ${{ secrets.CALCULATOR_URL }}
        run: |
          python monitor.py

      - name: Check whether countries.txt changed
        id: changes
        run: |
          if git diff --quiet -- countries.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated countries.txt
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add countries.txt

          git commit -m "Update destination availability"

          git push

      - name: No changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "countries.txt has not changed."
