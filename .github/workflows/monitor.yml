name: Monitor JP BH Posta

on:
  workflow_dispatch:

  # Enable after the monitor has been verified.
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Check monitor.py syntax
        run: |
          python -m py_compile monitor.py

      - name: Run monitor
        id: monitor
        continue-on-error: true
        env:
          CALCULATOR_URL: https://www.posta.ba/kalkulator-cijena/
        run: |
          python monitor.py

      - name: Show generated files
        if: always()
        run: |
          echo "============================================================"
          echo "WORKING DIRECTORY"
          echo "============================================================"
          pwd

          echo
          echo "============================================================"
          echo "ALL FILES"
          echo "============================================================"
          find . -maxdepth 3 -type f -print | sort

          echo
          echo "============================================================"
          echo "calculator-results.txt"
          echo "============================================================"

          if [ -f calculator-results.txt ]; then
            cat calculator-results.txt
          else
            echo "calculator-results.txt does not exist"
          fi

          echo
          echo "============================================================"
          echo "countries.txt"
          echo "============================================================"

          if [ -f countries.txt ]; then
            cat countries.txt
          else
            echo "countries.txt does not exist"
          fi

          echo
          echo "============================================================"
          echo "DIAGNOSTIC FILES"
          echo "============================================================"

          for f in \
            diagnostic.txt \
            diagnostic.html \
            diagnostic.png \
            page.html \
            iframe.html \
            iframe.txt
          do
            if [ -f "$f" ]; then
              echo
              echo "----- $f -----"

              if [[ "$f" == *.png ]]; then
                ls -lh "$f"
              else
                wc -c "$f"
                head -c 30000 "$f"
                echo
              fi
            else
              echo
              echo "$f does not exist"
            fi
          done

      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jp-bh-posta-monitor
          path: |
            calculator-results.txt
            countries.txt
            diagnostic.txt
            diagnostic.html
            diagnostic.png
            page.html
            iframe.html
            iframe.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Report monitor result
        if: always()
        run: |
          echo "Monitor outcome: ${{ steps.monitor.outcome }}"

          if [ "${{ steps.monitor.outcome }}" != "success" ]; then
            echo "Monitor failed."
            echo "Artifacts were still requested."
            exit 1
          fi

          echo "Monitor completed successfully."

