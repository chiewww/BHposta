name: Monitor BH Posta Countries

on:
  schedule:
    # Run once every day at 03:00 UTC.
    - cron: "0 3 * * *"

  # Allows manual testing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4

      - name: Fetch Dopisnica country list
        run: |
          python monitor.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- countries.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
            echo
            git diff -- countries.txt
          fi

      - name: Commit changed country list
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add countries.txt

          git commit -m "Update international postcard country list"

          git push
