      # ------------------------------------------------------
      # Check whether monitored files changed
      # ------------------------------------------------------
      - name: Check for changes
        id: changes
        if: always()
        run: |
          echo "========================================"
          echo "CHECKING FOR OUTPUT FILE CHANGES"
          echo "========================================"

          git status --short

          changed=false

          for file in \
            available_countries.txt \
            suspended_countries.txt \
            unknown_countries.txt \
            error_countries.txt
          do
            if [ -f "$file" ]; then
              echo "Found: $file"

              if ! git diff --quiet -- "$file"; then
                changed=true
              fi

              if git ls-files --error-unmatch "$file" >/dev/null 2>&1; then
                echo "  -> tracked"
              else
                echo "  -> untracked"
                changed=true
              fi
            else
              echo "Missing: $file"
            fi
          done

          if [ "$changed" = "true" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo
            echo "Changes detected."
            echo
            echo "========================================"
            echo "STATUS"
            echo "========================================"

            git status --short

            echo
            echo "========================================"
            echo "DIFF"
            echo "========================================"

            git diff -- \
              available_countries.txt \
              suspended_countries.txt \
              unknown_countries.txt \
              error_countries.txt || true

          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          fi

      # ------------------------------------------------------
      # Commit changed country lists
      # ------------------------------------------------------
      - name: Commit changed country lists
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            available_countries.txt \
            suspended_countries.txt \
            unknown_countries.txt \
            error_countries.txt

          git status --short

          git commit -m "Update international postcard country lists"

          git push
