name: Monitor JP BH Posta

on:
  workflow_dispatch:

  # Enable after the monitor has been verified.
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run monitor
        id: monitor
        env:
          CALCULATOR_URL: https://www.posta.ba/kalkulator-cijena/
        run: |
          python monitor.py

      - name: Show generated files
        if: always()
        run: |
          echo "============================================================"
          echo "WORKING DIRECTORY"
          echo "============================================================"
          pwd

          echo
          echo "============================================================"
          echo "ALL FILES"
          echo "============================================================"
          find . -maxdepth 3 -type f -print | sort

          echo
          echo "============================================================"
          echo "calculator-results.txt"
          echo "============================================================"

          if [ -f calculator-results.txt ]; then
            cat calculator-results.txt
          else
            echo "calculator-results.txt does not exist"
          fi

          echo
          echo "============================================================"
          echo "countries.txt"
          echo "============================================================"

          if [ -f countries.txt ]; then
            cat countries.txt
          else
            echo "countries.txt does not exist"
          fi

          echo
          echo "============================================================"
          echo "DIAGNOSTIC FILES"
          echo "============================================================"

          for f in \
            calculator-results.txt \
            countries.txt \
            diagnostic.txt \
            diagnostic.html \
            diagnostic.png \
            response.html \
            page.html \
            debug.txt \
            calculator.html \
            iframe.html \
            iframe.txt
          do
            if [ -f "$f" ]; then
              echo
              echo "----- $f -----"

              if [[ "$f" == *.png ]]; then
                ls -lh "$f"
              else
                wc -c "$f"
                head -c 30000 "$f"
                echo
              fi
            fi
          done

      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jp-bh-posta-monitor
          path: |
            calculator-results.txt
            countries.txt
            diagnostic.txt
            diagnostic.html
            diagnostic.png
            response.html
            page.html
            debug.txt
            calculator.html
            iframe.html
            iframe.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Verify calculator results were created
        if: steps.monitor.outcome == 'success'
        run: |
          if [ ! -s calculator-results.txt ]; then
            echo "ERROR: calculator-results.txt was not created or is empty."
            exit 1
          fi

          echo "calculator-results.txt was successfully created."
          echo
          echo "File size:"
          wc -c calculator-results.txt

          echo
          echo "First 100 lines:"
          head -n 100 calculator-results.txt

      - name: Report monitor result
        if: always()
        run: |
          echo "Monitor outcome: ${{ steps.monitor.outcome }}"

          if [ "${{ steps.monitor.outcome }}" = "success" ]; then
            echo "Monitor completed successfully."
          else
            echo "Monitor failed."
            echo "Diagnostic artifacts were uploaded."
          fi

      # ============================================================
      # DO NOT ENABLE AUTOMATIC COMMIT YET.
      #
      # First verify that calculator-results.txt contains the
      # correct destinations, unavailable destinations, services,
      # weights and prices.
      # ============================================================

      # - name: Check whether results changed
      #   id: changes
      #   run: |
      #     if git diff --quiet -- calculator-results.txt; then
      #       echo "changed=false" >> "$GITHUB_OUTPUT"
      #     else
      #       echo "changed=true" >> "$GITHUB_OUTPUT"
      #     fi

      # - name: Commit updated calculator results
      #   if: steps.changes.outputs.changed == 'true'
      #   run: |
      #     git config user.name "github-actions[bot]"
      #     git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      #
      #     git add calculator-results.txt
      #     git commit -m "Update JP BH Posta calculator results"
      #     git push

      # - name: No changes
      #   if: steps.changes.outputs.changed == 'false'
      #   run: |
      #     echo "calculator-results.txt has not changed."
