name: Monitor JP BH Posta

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # ------------------------------------------------------------
      # Check syntax BEFORE running the monitor.
      # ------------------------------------------------------------
      - name: Check monitor.py syntax
        id: syntax
        continue-on-error: true
        run: |
          python -m py_compile monitor.py

      # ------------------------------------------------------------
      # Run monitor only when syntax is valid.
      # ------------------------------------------------------------
      - name: Run monitor
        id: monitor
        if: steps.syntax.outcome == 'success'
        continue-on-error: true
        env:
          CALCULATOR_URL: https://www.posta.ba/kalkulator-cijena/
        run: |
          python monitor.py

      # ------------------------------------------------------------
      # Always create a status file.
      # ------------------------------------------------------------
      - name: Create monitor status
        if: always()
        run: |
          {
            echo "JP BH POSTA MONITOR STATUS"
            echo "=========================="
            echo
            echo "Syntax check: ${{ steps.syntax.outcome }}"
            echo "Monitor:      ${{ steps.monitor.outcome }}"
            echo
            echo "Working directory:"
            pwd
            echo
            echo "Files:"
            find . -maxdepth 3 -type f -print | sort
          } > monitor-status.txt

          cat monitor-status.txt

      # ------------------------------------------------------------
      # Display anything that was produced.
      # ------------------------------------------------------------
      - name: Show generated files
        if: always()
        run: |
          echo "============================================================"
          echo "GENERATED FILES"
          echo "============================================================"

          find . -maxdepth 3 -type f -print | sort

          for f in \
            monitor-status.txt \
            calculator-results.txt \
            countries.txt \
            diagnostic.txt \
            diagnostic.html \
            diagnostic.png \
            response.html \
            page.html \
            debug.txt \
            calculator.html \
            iframe.html \
            iframe.txt
          do
            if [ -f "$f" ]; then
              echo
              echo "============================================================"
              echo "$f"
              echo "============================================================"

              if [[ "$f" == *.png ]]; then
                ls -lh "$f"
              else
                wc -c "$f"
                head -c 30000 "$f"
                echo
              fi
            fi
          done

      # ------------------------------------------------------------
      # ALWAYS upload artifacts.
      # ------------------------------------------------------------
      - name: Upload monitor artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jp-bh-posta-monitor
          path: |
            monitor-status.txt
            calculator-results.txt
            countries.txt
            diagnostic.txt
            diagnostic.html
            diagnostic.png
            response.html
            page.html
            debug.txt
            calculator.html
            iframe.html
            iframe.txt
          if-no-files-found: warn
          retention-days: 14

      # ------------------------------------------------------------
      # Explicitly fail if monitor.py has invalid Python syntax.
      # ------------------------------------------------------------
      - name: Fail on syntax error
        if: steps.syntax.outcome != 'success'
        run: |
          echo "monitor.py contains a Python syntax error."
          echo "The monitor was not executed."
          exit 1

      # ------------------------------------------------------------
      # Explicitly fail if monitor itself failed.
      # ------------------------------------------------------------
      - name: Fail if monitor failed
        if: steps.syntax.outcome == 'success' && steps.monitor.outcome != 'success'
        run: |
          echo "monitor.py executed but failed."
          echo "See the uploaded jp-bh-posta-monitor artifact."
          exit 1

      # ------------------------------------------------------------
      # Verify results.
      # ------------------------------------------------------------
      - name: Verify calculator-results.txt
        if: steps.monitor.outcome == 'success'
        run: |
          if [ ! -s calculator-results.txt ]; then
            echo "ERROR: calculator-results.txt is missing or empty."
            exit 1
          fi

          echo "calculator-results.txt exists:"
          wc -c calculator-results.txt

          echo
          echo "First 100 lines:"
          head -n 100 calculator-results.txt
