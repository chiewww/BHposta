name: Monitor JP BH Posta

on:
  workflow_dispatch:

  # ==========================================================
  # DAILY MONITORING
  # ==========================================================
  # Keep this disabled until the diagnostic run successfully
  # finds the calculator and produces correct results.
  #
  # schedule:
  #   - cron: "0 3 * * *"
  #
  # 03:00 UTC = 05:00 Bosnia/Croatia/Serbia time during CEST.
  # ==========================================================

permissions:
  contents: write

jobs:
  monitor:
    name: JP BH Pošta Calculator Monitor
    runs-on: ubuntu-latest

    steps:

      # ========================================================
      # CHECKOUT
      # ========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ========================================================
      # PYTHON
      # ========================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      # ========================================================
      # PYTHON DEPENDENCIES
      # ========================================================

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ========================================================
      # PLAYWRIGHT
      # ========================================================

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium


      # ========================================================
      # RUN MONITOR
      # ========================================================

      - name: Run monitor
        env:
          CALCULATOR_URL: ${{ secrets.CALCULATOR_URL }}
        run: |
          python monitor.py


      # ========================================================
      # SHOW RESULTS IN ACTION LOG
      # ========================================================

      - name: Show generated files
        if: always()
        run: |
          echo "======================================================"
          echo "REPOSITORY FILES"
          echo "======================================================"

          find . -maxdepth 2 -type f | sort

          echo
          echo "======================================================"
          echo "countries.txt"
          echo "======================================================"

          if [ -f countries.txt ]; then
            cat countries.txt
          else
            echo "countries.txt does not exist"
          fi

          echo
          echo "======================================================"
          echo "diagnostic.txt"
          echo "======================================================"

          if [ -f diagnostic.txt ]; then
            cat diagnostic.txt
          else
            echo "diagnostic.txt does not exist"
          fi

          echo
          echo "======================================================"
          echo "HTML FILE SIZES"
          echo "======================================================"

          for f in page.html response.html diagnostic.html debug.txt; do
            if [ -f "$f" ]; then
              echo
              echo "$f:"
              wc -c "$f"
            else
              echo "$f: not present"
            fi
          done


      # ========================================================
      # UPLOAD DIAGNOSTIC ARTIFACTS
      # ========================================================

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jp-bh-posta-diagnostic
          path: |
            countries.txt
            diagnostic.txt
            diagnostic.png
            diagnostic.html
            response.html
            page.html
            debug.txt
          if-no-files-found: ignore
          retention-days: 7


      # ========================================================
      # DO NOT COMMIT DURING DIAGNOSTIC PHASE
      # ========================================================
      #
      # We intentionally do NOT commit countries.txt yet.
      #
      # First we need to confirm that:
      #
      # 1. GitHub Actions reaches the real calculator.
      # 2. ddlMeDoOdrediste is found.
      # 3. All countries are extracted.
      # 4. Izračunaj works.
      # 5. The unavailable-country error is detected correctly.
      #
      # Once that is confirmed, enable the production section below.
      # ========================================================


      # ========================================================
      # PRODUCTION SECTION -- CURRENTLY DISABLED
      # ========================================================
